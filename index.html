<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050508">
  <title>Life Track</title>

  <!-- PWA / instalable en el celular -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { margin: 0; background: #050508; font-family: 'Inter', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
    @keyframes floatUp { 0% { opacity: 0; transform: translateY(8px) scale(.9); } 18% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-30px) scale(1); } }
    .anim-fade { animation: fadeIn .4s ease; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/app-jsx" id="app-src">
    const { useState, useRef, useEffect } = React;
    const ACCENT = '#7c73f0';

    // ---------- Fechas (clave por día YYYY-MM-DD) ----------
    const pad = n => String(n).padStart(2, '0');
    const dk = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
    const todayKey = dk(new Date());
    const NOMBRES_DIA = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    const etiquetaFecha = (key) => {
      if (key === todayKey) return 'Hoy';
      const ayer = new Date(); ayer.setDate(ayer.getDate() - 1);
      if (key === dk(ayer)) return 'Ayer';
      const d = parseKey(key);
      const s = d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'short' });
      return s.charAt(0).toUpperCase() + s.slice(1);
    };
    const etiquetaCorta = (key) => {
      const d = parseKey(key);
      return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
    };

    // ---------- Persistencia (localStorage) ----------
    const LS_KEY = 'lifetrack_v3';
    const FB_CONFIG_KEY = 'lifetrack_fb_config'; // config de Firebase (público, no secreto)
    const cargar = () => {
      try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
      catch (e) { return {}; }
    };
    const G = cargar();
    // Configuración de Firebase ya integrada (es pública, no secreta). Así cualquier
    // dispositivo pide directamente email y contraseña, sin el paso de "Configurar".
    const CONFIG_FB_DEFECTO = {
      apiKey: "AIzaSyAM_gbVab4ECGLmv38zWSudinRZKBj3H3Q",
      authDomain: "experienceapp-f40af.firebaseapp.com",
      projectId: "experienceapp-f40af",
      storageBucket: "experienceapp-f40af.firebasestorage.app",
      messagingSenderId: "866444950578",
      appId: "1:866444950578:web:5f7a10c17214c4d33fd02b"
    };
    const cargarConfigFB = () => {
      try { const c = JSON.parse(localStorage.getItem(FB_CONFIG_KEY)); if (c && c.apiKey) return c; } catch (e) {}
      return CONFIG_FB_DEFECTO;
    };

    // Carga los SDK de Firebase (compat) sólo cuando se necesitan
    const cargarFirebaseSDK = () => new Promise((resolve, reject) => {
      if (window.firebase && window.firebase.firestore) return resolve();
      const urls = [
        'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',
        'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js',
        'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js',
      ];
      let i = 0;
      const next = () => {
        if (i >= urls.length) return resolve();
        const s = document.createElement('script');
        s.src = urls[i++];
        s.onload = next;
        s.onerror = () => reject(new Error('No se pudo cargar Firebase (revisa tu conexión)'));
        document.head.appendChild(s);
      };
      next();
    });
    // Extrae los campos de la config pegada desde la consola de Firebase (sin ejecutar código)
    const parsearConfigFB = (txt) => {
      const get = (k) => { const m = (txt || '').match(new RegExp(k + '\\s*:\\s*["\\x27]([^"\\x27]+)["\\x27]')); return m ? m[1] : ''; };
      const cfg = { apiKey: get('apiKey'), authDomain: get('authDomain'), projectId: get('projectId'), storageBucket: get('storageBucket'), messagingSenderId: get('messagingSenderId'), appId: get('appId') };
      if (!cfg.apiKey || !cfg.projectId) throw new Error('config incompleta');
      return cfg;
    };

    // ---------- Icons (SVG limpios) ----------
    const Ico = ({ d, size = 20, sw = 2, children }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
        {d ? <path d={d}></path> : children}
      </svg>
    );
    const IconPanel = () => <Ico><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></Ico>;
    const IconZap = () => <Ico><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></Ico>;
    const IconSun = () => <Ico><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></Ico>;
    const IconCheck = () => <Ico><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></Ico>;
    const IconNote = () => <Ico><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="14" y2="17"></line></Ico>;
    const IconArchive = () => <Ico><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"></path><line x1="10" y1="12" x2="14" y2="12"></line></Ico>;
    const IconCamera = () => <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>;
    const IconTick = ({ c = '#fff' }) => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>;
    const IconEdit = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>;
    const IconChevron = ({ dir = 'left' }) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ transform: dir === 'right' ? 'rotate(180deg)' : 'none' }}><polyline points="15 18 9 12 15 6"></polyline></svg>;
    const IconLock = () => <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>;
    const IconUndo = () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5h-4"></path></svg>;
    const IconGift = () => <Ico><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></Ico>;
    const IconCoin = ({ size = 13 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="#f5b23e" strokeWidth="2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.5"></circle></svg>;
    const IconTarget = () => <Ico><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></Ico>;
    const IconGear = () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;

    // ---------- Barra segmentada (HUD) ----------
    const SegBar = ({ pct, c1, c2 }) => {
      const n = 12, on = Math.round(pct / 100 * n);
      return (
        <div className="flex gap-[3px]">
          {Array.from({ length: n }).map((_, i) => (
            <div key={i} className="flex-1 h-[9px] rounded-[2px] transition-all duration-300" style={{
              background: i < on ? `linear-gradient(180deg,${c1},${c2})` : 'rgba(255,255,255,0.06)',
              boxShadow: i < on ? `0 0 6px ${c1}66` : 'none'
            }}></div>
          ))}
        </div>
      );
    };

    const NAV = [
      { id: 'dashboard', label: 'Panel', Icon: IconPanel },
      { id: 'habitos', label: 'Hábitos', Icon: IconZap },
      { id: 'pendientes', label: 'Tareas', Icon: IconCheck },
      { id: 'notas', label: 'Notas', Icon: IconNote },
      { id: 'metas', label: 'Metas', Icon: IconTarget },
      { id: 'premios', label: 'Premios', Icon: IconGift },
      { id: 'archivo', label: 'Archivo', Icon: IconArchive },
    ];

    // ---------- Dificultad: pondera cuánta XP das al lograr y cuánta vida pierdes al fallar ----------
    const DIF = {
      trivial: { label: 'Trivial', xp: 3,  dano: 2,  cura: 1, c: '#8b93a3' },
      facil:   { label: 'Fácil',   xp: 6,  dano: 5,  cura: 2, c: '#34d399' },
      media:   { label: 'Media',   xp: 10, dano: 10, cura: 3, c: '#a78bfa' },
      dificil: { label: 'Difícil', xp: 16, dano: 18, cura: 5, c: '#fb7185' },
    };
    const DIF_ORDEN = ['trivial', 'facil', 'media', 'dificil'];
    const difDe = (it) => DIF[(it && it.dificultad) || 'media'];

    // ---------- Modos de balance (XP que da / vida que quita / vida que cura, por dificultad) ----------
    const PRESETS = {
      suave:    { trivial: { xp: 5, dano: 1, cura: 2 }, facil: { xp: 10, dano: 3, cura: 3 }, media: { xp: 16, dano: 6,  cura: 4 }, dificil: { xp: 24, dano: 10, cura: 6 } },
      normal:   { trivial: { xp: 3, dano: 2, cura: 1 }, facil: { xp: 6,  dano: 5, cura: 2 }, media: { xp: 10, dano: 10, cura: 3 }, dificil: { xp: 16, dano: 18, cura: 5 } },
      exigente: { trivial: { xp: 2, dano: 4, cura: 1 }, facil: { xp: 4,  dano: 9, cura: 1 }, media: { xp: 7,  dano: 16, cura: 2 }, dificil: { xp: 12, dano: 28, cura: 3 } },
    };
    const MODOS = [
      { id: 'suave',         label: 'Suave',         desc: 'Da más XP y fallar apenas duele' },
      { id: 'normal',        label: 'Normal',        desc: 'Equilibrado' },
      { id: 'exigente',      label: 'Exigente',      desc: 'Da menos XP y fallar duele mucho' },
      { id: 'personalizado', label: 'Personalizado', desc: 'Tus propios números' },
    ];

    // ---------- Rangos (según tu nivel; los saltos crecen para que cada rango cueste más) ----------
    const RANGOS = [
      { min: 1,  label: 'Aprendiz',     c: '#8b93a3' },
      { min: 5,  label: 'Iniciado',     c: '#34d399' },
      { min: 10, label: 'Adepto',       c: '#38bdf8' },
      { min: 20, label: 'Experto',      c: '#a78bfa' },
      { min: 35, label: 'Maestro',      c: '#f5b23e' },
      { min: 55, label: 'Gran Maestro', c: '#fb7185' },
      { min: 80, label: 'Leyenda',      c: '#f472b6' },
    ];
    const rangoDe = (nivel) => { let r = RANGOS[0]; for (const x of RANGOS) { if (nivel >= x.min) r = x; } return r; };
    const rangoSiguiente = (nivel) => { for (const x of RANGOS) { if (nivel < x.min) return x; } return null; };

    // ---------- Días de la semana para programar diarias (n = getDay(): 0=Dom..6=Sáb) ----------
    const DIAS_SEM = [
      { n: 1, label: 'L' }, { n: 2, label: 'M' }, { n: 3, label: 'M' },
      { n: 4, label: 'J' }, { n: 5, label: 'V' }, { n: 6, label: 'S' }, { n: 0, label: 'D' },
    ];
    const TODOS_DIAS = [0, 1, 2, 3, 4, 5, 6];
    const diasDe = (d) => (d && d.dias && d.dias.length ? d.dias : TODOS_DIAS);
    const enDia = (d, key) => diasDe(d).includes(parseKey(key).getDay());
    // ¿El ítem (hábito/diaria) existía en el día 'key'? Congela el pasado:
    // aparece desde su fecha de creación y hasta el día en que se archivó (exclusivo).
    const existe = (it, key) => (!it.creado || it.creado <= key) && (!it.archivado || key < it.archivado);
    const etiquetaDias = (dias) => {
      const s = (dias && dias.length ? dias : TODOS_DIAS);
      if (s.length === 7) return 'Todos los días';
      if (s.length === 5 && [1, 2, 3, 4, 5].every(x => s.includes(x))) return 'Lun a Vie';
      if (s.length === 2 && s.includes(0) && s.includes(6)) return 'Fin de semana';
      return DIAS_SEM.filter(w => s.includes(w.n)).map(w => w.label).join(' ');
    };
    // ¿La tarea fue completada en el día 'key'? El completado se registra por fecha
    // (completedDates) y es INMUTABLE: los días pasados se leen de aquí, sin importar si
    // la tarea matriz está hoy archivada o modificada.
    const hechaEn = (p, key) => Array.isArray(p.completedDates) && p.completedDates.includes(key);
    // ¿La tarea está PENDIENTE (activa) en el día 'key'? Base del filtro de "Hoy":
    // no archivada, ya existente ese día, no completada ese día, y que corresponda a ese
    // día (recurrente = coincide con el día de la semana; de un solo uso = hasta completarla).
    const tareaActivaEn = (p, key) => {
      if (p.isArchived) return false;
      if (!existe(p, key)) return false;
      if (hechaEn(p, key)) return false;
      if (p.recurrente === false) return (p.completedDates || []).length === 0;
      return enDia(p, key);
    };
    // Migra tareas de modelos viejos y corrige la regresión: las tareas anteriores a esta
    // versión (sin 'recurrente') se tratan como de un solo uso, así las ya completadas dejan
    // de inundar "Hoy". No se pierde nada: completedDates conserva el historial.
    const migrarTareas = (arr) => (arr || []).map(p => {
      const q = { ...p };
      if (!Array.isArray(q.completedDates)) q.completedDates = (q.completado && q.completadoFecha) ? [q.completadoFecha] : [];
      delete q.completado; delete q.completadoFecha;
      if (q.recurrente === undefined) q.recurrente = false;
      if (q.isArchived === undefined) q.isArchived = false;
      return q;
    });

    function App() {
      // ---- Progresión del personaje (inicio coherente: todo bajo) ----
      const [nivel, setNivel] = useState(G.nivel ?? 1);
      const [hp, setHp] = useState(G.hp ?? 50);
      const [xp, setXp] = useState(G.xp ?? 0);
      const [oro, setOro] = useState(G.oro ?? 0);
      const [fotoPerfil, setFotoPerfil] = useState(G.fotoPerfil ?? null);

      // ---- Registros ligados a cada día ----
      const [xpPorDia, setXpPorDia] = useState(G.xpPorDia ?? {});          // { dia: xp ganada }
      const [tareasPorDia, setTareasPorDia] = useState(G.tareasPorDia ?? {}); // { dia: nº acciones }
      const [diasCompletados, setDiasCompletados] = useState(G.diasCompletados ?? {}); // { dia: true }
      const [habitLog, setHabitLog] = useState(G.habitLog ?? {});          // { habitId: { dia: conteo } }  (positivos)
      const [habitNegLog, setHabitNegLog] = useState(G.habitNegLog ?? {}); // { habitId: { dia: conteo } }  (negativos)
      const [efectos, setEfectos] = useState(G.efectos ?? {});            // { clave: [efecto,...] } efecto exacto de cada acción, para revertir idéntico
      const [ultimoDia, setUltimoDia] = useState(G.ultimoDia ?? todayKey); // última vez que se abrió (para penalizar diarias sin cumplir)
      // ---- HISTORIAL LEGADO (módulo "Diarias", ya retirado) ----
      // Se CONSERVA para no perder el registro de lo que se hizo cada día y para poder
      // mostrarlo en días anteriores. diariaLog = { diariaId: { dia: true } }.
      const [diarias, setDiarias] = useState(G.diarias ?? []);
      const [diariaLog, setDiariaLog] = useState(G.diariaLog ?? {});

      // ---- Balance ajustable ----
      const [modoBalance, setModoBalance] = useState(G.modoBalance ?? 'normal');
      const [balance, setBalance] = useState(G.balance ?? PRESETS.normal);

      // ---- Definiciones (hábitos y tareas ahora se pueden programar por día de la semana) ----
      const [habitos, setHabitos] = useState(G.habitos ?? [
        { id: 1, texto: 'Lectura de Marco Aurelio', tipo: 'positivo', dias: TODOS_DIAS },
        { id: 2, texto: 'Comida rápida', tipo: 'negativo', dias: TODOS_DIAS },
        { id: 3, texto: 'Trote matutino', tipo: 'ambos', dias: TODOS_DIAS },
      ]);
      // Tareas: fecha = día de creación, dias = días programados,
      // completedDates = fechas en que se marcó completada (recurrente, no se borra)
      const [pendientes, setPendientes] = useState(migrarTareas(G.pendientes ?? []));
      const [notas, setNotas] = useState(G.notas ?? []);
      // Metas a largo plazo: progreso acumulado hacia un objetivo
      // Metas: el progreso se calcula solo, a partir de las TAREAS vinculadas (metaId)
      const [metas, setMetas] = useState(G.metas ?? [
        { id: 1, texto: 'Leer 12 libros', color: '#a78bfa' },
        { id: 2, texto: 'Ponerme en forma', color: '#34d399' },
      ]);
      // Premios canjeables con oro (editables por el usuario)
      const [recompensas, setRecompensas] = useState(G.recompensas ?? [
        { id: 1, texto: '🎬 Ver una película', costo: 100, veces: 0 },
        { id: 2, texto: '🍕 Pedir comida', costo: 200, veces: 0 },
        { id: 3, texto: '🎮 Tarde de juego', costo: 350, veces: 0 },
      ]);

      // ---- Estado de UI ----
      const [tab, setTab] = useState('dashboard');
      const [selDia, setSelDia] = useState(todayKey);
      const [nuevoTexto, setNuevoTexto] = useState('');
      const [nuevoTipo, setNuevoTipo] = useState('ambos');
      const [nuevaDif, setNuevaDif] = useState('media');
      const [nuevaDias, setNuevaDias] = useState(TODOS_DIAS);
      const [nuevaMetaId, setNuevaMetaId] = useState(null); // meta padre para una tarea nueva (o null)
      const [nuevaRecurrente, setNuevaRecurrente] = useState(true); // ¿la tarea nueva se repite en sus días?
      const [itemEdit, setItemEdit] = useState(null);   // edición genérica de hábito/tarea (texto, tipo, dificultad, días, metaId)
      const [menuAbierto, setMenuAbierto] = useState(false); // menú de configuración (desde la foto de perfil)
      const [vistaLista, setVistaLista] = useState('hoy');   // 'hoy' | 'todas' en Hábitos/Tareas
      const [nuevaMeta, setNuevaMeta] = useState('');
      const [nuevaMetaObj, setNuevaMetaObj] = useState('');       // objetivo total (nº de aportaciones) opcional
      const [nuevaMetaInicio, setNuevaMetaInicio] = useState(''); // fecha inicio (YYYY-MM-DD) opcional
      const [nuevaMetaFin, setNuevaMetaFin] = useState('');       // fecha límite (YYYY-MM-DD) opcional
      const [metaError, setMetaError] = useState('');
      const [metaEdit, setMetaEdit] = useState(null);
      const [formAbierto, setFormAbierto] = useState(false);      // formulario de creación (Hábitos/Tareas) colapsable
      const [tituloNota, setTituloNota] = useState('');
      const [contenidoNota, setContenidoNota] = useState('');
      const [editandoNota, setEditandoNota] = useState(null);
      const [notaExpandida, setNotaExpandida] = useState(null);
      const [notasVista, setNotasVista] = useState('dia');
      const [mesVista, setMesVista] = useState(todayKey.slice(0, 7)); // 'YYYY-MM' del mes que se ve en la vista mensual
      const [nuevaRecTexto, setNuevaRecTexto] = useState('');
      const [nuevaRecCosto, setNuevaRecCosto] = useState('');
      const [editandoRec, setEditandoRec] = useState(null);
      const [ajustesAbierto, setAjustesAbierto] = useState(false);
      const [transfer, setTransfer] = useState(null);        // null | 'copiar' | 'pegar'
      const [textoTransfer, setTextoTransfer] = useState(''); // datos a copiar
      const [textoPegar, setTextoPegar] = useState('');       // datos pegados
      // ---- Sincronización en la nube (Firebase) ----
      const [sync, setSync] = useState(() => (cargarConfigFB() ? 'desconectado' : 'sinConfig')); // sinConfig|desconectado|conectando|conectado
      const [syncEmail, setSyncEmail] = useState('');
      const [syncPass, setSyncPass] = useState('');
      const [syncError, setSyncError] = useState('');
      const [syncUser, setSyncUser] = useState('');
      const [configAbierto, setConfigAbierto] = useState(false);
      const [configTexto, setConfigTexto] = useState('');
      const fbRef = useRef({ app: null, auth: null, db: null, user: null, unsub: null });
      const pushTimer = useRef(null);
      const dirty = useRef(false);                                              // hay cambios locales sin subir
      const visto = useRef((() => { try { return localStorage.getItem('lifetrack_visto') || ''; } catch (e) { return ''; } })()); // id de la última versión sincronizada
      const [avisoPenal, setAvisoPenal] = useState(0);
      const [avisoNiveles, setAvisoNiveles] = useState(0);
      const [avisoDias, setAvisoDias] = useState(0);
      const [floaters, setFloaters] = useState([]);
      const fileRef = useRef(null);
      const importRef = useRef(null);
      const mergeRef = useRef(null);
      const stripRef = useRef(null);

      const esHoy = selDia === todayKey;

      // ---- Guardado automático ----
      const primerSave = useRef(true);
      const interactuo = useRef(false); // ¿el usuario ya tocó/escribió algo? (distingue cambios reales de los del arranque)
      // Marca interacción real del usuario (no cuenta abrir la app ni los efectos de arranque)
      useEffect(() => {
        const marcar = () => { interactuo.current = true; };
        window.addEventListener('pointerdown', marcar);
        window.addEventListener('keydown', marcar);
        return () => { window.removeEventListener('pointerdown', marcar); window.removeEventListener('keydown', marcar); };
      }, []);
      useEffect(() => {
        // _cambio: id ÚNICO de la versión. SÓLO cambia con una acción real del usuario
        // (después de que tocó/escribió algo), NUNCA al abrir. Así abrir la app no crea
        // una "versión nueva" que dispare recargas en cadena entre dispositivos.
        const bump = interactuo.current && !primerSave.current;
        let cambio;
        if (bump) { cambio = Date.now() + '-' + Math.random().toString(36).slice(2, 8); }
        else { cambio = G._cambio || ''; try { const p = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); if (p._cambio) cambio = p._cambio; } catch (e) {} }
        const data = { nivel, hp, xp, oro, fotoPerfil, xpPorDia, tareasPorDia, diasCompletados, habitLog, habitNegLog, diariaLog, efectos, ultimoDia, modoBalance, balance, habitos, diarias, pendientes, notas, recompensas, metas, _cambio: cambio };
        try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) {}
        if (bump) { dirty.current = true; programarPush(); }
        primerSave.current = false;
      }, [nivel, hp, xp, oro, fotoPerfil, xpPorDia, tareasPorDia, diasCompletados, habitLog, habitNegLog, diariaLog, efectos, ultimoDia, modoBalance, balance, habitos, diarias, pendientes, notas, recompensas, metas]);

      // ---- Al abrir: penalizar CADA día perdido (sin actividad) desde la última vez.
      //      La penalización se acumula y, si la vida se acaba, BAJAS DE NIVEL. ----
      useEffect(() => {
        if (ultimoDia && ultimoDia < todayKey) {
          const BASE_INACTIVIDAD = 12; // castigo por cada día sin actividad
          let total = 0, dias = 0;
          let d = parseKey(ultimoDia), guard = 0;
          while (dk(d) < todayKey && guard < 60) { // desde la última vez hasta ayer (máx 60 días)
            const D = dk(d);
            const activo = (xpPorDia[D] || 0) > 0;
            if (!activo) { total += BASE_INACTIVIDAD; dias += 1; } // día sin actividad -> penaliza
            d.setDate(d.getDate() + 1); guard += 1;
          }
          if (total > 0) {
            // Aplica el daño; cada 100 de daño que pasa de tu vida = 1 nivel menos (con 100 de colchón).
            let h = hp - total, n = nivel;
            while (h < 1 && n > 1) { n -= 1; h += 100; }
            if (h < 1) h = 1; // en nivel 1 ya no bajas más; te quedas con 1 de vida
            setHp(Math.round(h));
            setNivel(n);
            setAvisoPenal(total);
            setAvisoNiveles(nivel - n);
            setAvisoDias(dias);
          }
        }
        setUltimoDia(todayKey);
      // eslint-disable-next-line
      }, []);

      // ---- Racha 100% real: se DERIVA de tu productividad (días con XP > 0),
      //      exactamente lo que muestra la gráfica. No se guarda ningún registro
      //      aparte, así que es imposible que se desincronice o se ensucie. ----
      const diaActivo = (key) => (xpPorDia[key] || 0) > 0;
      const calcRacha = () => {
        let r = 0; const d = new Date();
        if (!diaActivo(dk(d))) d.setDate(d.getDate() - 1); // si hoy aún no hay actividad, cuenta desde ayer
        while (diaActivo(dk(d))) { r++; d.setDate(d.getDate() - 1); }
        return r;
      };
      const racha = calcRacha();

      // Pesos del progreso de la gráfica: las TAREAS pesan más que los HÁBITOS
      // (Hábitos ≈20% del peso, Tareas ≈80%), pero un hábito completado SIEMPRE suma.
      const PESO_HABITO = 5;
      const PESO_TAREA = 20;
      // Progreso ponderado de un día concreto. Se calcula SIEMPRE desde el historial
      // guardado (habitLog + tareas completadas ese día), así los días pasados nunca
      // se borran ni se sobreescriben: cada día refleja lo que se registró en su momento.
      const progresoDeDia = (key) => {
        const habitosDia = Object.values(habitLog).reduce((s, o) => s + (o[key] || 0), 0);
        const tareasDia = pendientes.reduce((s, p) => s + (hechaEn(p, key) ? 1 : 0), 0);
        // Incluye el historial legado de diarias, para que los días pasados no pierdan volumen.
        const diariasDia = Object.values(diariaLog).reduce((s, o) => s + (o[key] ? 1 : 0), 0);
        return Math.min(100, habitosDia * PESO_HABITO + (tareasDia + diariasDia) * PESO_TAREA);
      };

      // ---- Últimos 7 días (tira del encabezado + gráfica) ----
      const ultimos7 = () => {
        const r = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i);
          const key = dk(d);
          r.push({
            id: key, numero: d.getDate(), nombre: NOMBRES_DIA[d.getDay()],
            completado: !!diasCompletados[key], isToday: i === 0, isSel: key === selDia,
            actividad: progresoDeDia(key), // ponderado y derivado del historial (tareas >> hábitos)
          });
        }
        return r;
      };
      const semana = ultimos7();

      // ---- Tira de días deslizable: desde el primer día con datos (o 30 días atrás) hasta hoy ----
      const construirDiasStrip = () => {
        let min = todayKey;
        const push = k => { if (k && k < min) min = k; };
        Object.keys(xpPorDia).forEach(push);
        Object.keys(diasCompletados).forEach(push);
        Object.values(habitLog).forEach(o => Object.keys(o).forEach(push));
        Object.values(habitNegLog).forEach(o => Object.keys(o).forEach(push));
        notas.forEach(n => push(n.fecha));
        pendientes.forEach(p => { push(p.fecha); (p.completedDates || []).forEach(push); });
        Object.values(diariaLog).forEach(o => Object.keys(o).forEach(push)); // historial legado
        const hace30 = (() => { const d = new Date(); d.setDate(d.getDate() - 29); return dk(d); })();
        if (hace30 < min) min = hace30;
        const arr = []; let d = parseKey(min); let guard = 0;
        while (dk(d) <= todayKey && guard < 800) {
          const key = dk(d);
          arr.push({ id: key, numero: d.getDate(), nombre: NOMBRES_DIA[d.getDay()], completado: !!diasCompletados[key], activo: diaActivo(key), isToday: key === todayKey, isSel: key === selDia });
          d.setDate(d.getDate() + 1); guard++;
        }
        return arr;
      };
      const diasStrip = construirDiasStrip();

      // Al abrir, desliza la tira hasta hoy (extremo derecho)
      useEffect(() => { const el = stripRef.current; if (el) el.scrollLeft = el.scrollWidth; }, []);
      // Al cambiar de pestaña, colapsa el formulario de creación (lista limpia)
      useEffect(() => { setFormAbierto(false); }, [tab]);

      // ---- feedback flotante ----
      const addFloater = (text, color) => {
        const id = Date.now() + Math.random();
        setFloaters(f => [...f, { id, text, color }]);
        setTimeout(() => setFloaters(f => f.filter(x => x.id !== id)), 1100);
      };

      // ---- Sistema de efectos exactos ----
      // 'aplicar' hace un cambio y DEVUELVE el efecto real aplicado (ya con topes),
      // para que al deshacer se revierta idéntico. 'revertir' resta ese mismo efecto.
      const aplicar = (n) => {
        const totalAntes = (nivel - 1) * 100 + xp;
        let total = Math.max(0, totalAntes + (n.xp || 0));
        let h = hp + (n.hp || 0);
        // Si el daño deja la vida bajo 0, el excedente BAJA DE NIVEL (100 de daño = 1 nivel, con 100 de colchón de vida)
        while (h < 0 && total >= 100) { total -= 100; h += 100; }
        h = Math.max(0, Math.min(100, h));
        const oroDesp = Math.max(0, oro + (n.oro || 0));
        setNivel(Math.floor(total / 100) + 1);
        setXp(total % 100);
        setHp(h);
        setOro(oroDesp);
        const dia = n.dia || todayKey;
        if (n.xpDia) setXpPorDia(m => ({ ...m, [dia]: Math.max(0, (m[dia] || 0) + n.xpDia) }));
        if (n.tareas) setTareasPorDia(m => ({ ...m, [dia]: Math.max(0, (m[dia] || 0) + n.tareas) }));
        return { dTotal: total - totalAntes, dHp: h - hp, dOro: oroDesp - oro, dia, dXpDia: n.xpDia || 0, dTareas: n.tareas || 0 };
      };
      const revertir = (ef) => {
        if (!ef) return;
        const totalAntes = (nivel - 1) * 100 + xp;
        const totalDesp = Math.max(0, totalAntes - (ef.dTotal || 0));
        setNivel(Math.floor(totalDesp / 100) + 1);
        setXp(totalDesp % 100);
        setHp(x => Math.max(0, Math.min(100, x - (ef.dHp || 0))));
        setOro(o => Math.max(0, o - (ef.dOro || 0)));
        const restar = (m, dia, cant) => { const v = Math.max(0, (m[dia] || 0) - cant); const c = { ...m }; if (v <= 0) delete c[dia]; else c[dia] = v; return c; };
        if (ef.dXpDia) setXpPorDia(m => restar(m, ef.dia, ef.dXpDia));
        if (ef.dTareas) setTareasPorDia(m => restar(m, ef.dia, ef.dTareas));
      };
      const pushEfecto = (key, ef) => setEfectos(e => ({ ...e, [key]: [...(e[key] || []), ef] }));
      const popEfecto = (key) => {
        const arr = efectos[key] || [];
        if (!arr.length) return null;
        const ef = arr[arr.length - 1];
        setEfectos(e => ({ ...e, [key]: (e[key] || []).slice(0, -1) }));
        return ef;
      };

      // Valores de balance activos para un elemento según su dificultad
      const valDe = (it) => balance[(it && it.dificultad) || 'media'] || PRESETS.normal.media;
      const aplicarModo = (id) => { setModoBalance(id); if (id !== 'personalizado') setBalance(PRESETS[id]); };
      const setBalVal = (tier, campo, valor) => {
        const n = Math.max(0, Math.min(999, parseInt(valor, 10) || 0));
        setBalance(b => ({ ...b, [tier]: { ...b[tier], [campo]: n } }));
        setModoBalance('personalizado');
      };

      // ---- Acciones (sólo sobre el día de hoy) ----
      const countHabito = (id) => (habitLog[id] && habitLog[id][selDia]) || 0;
      const countHabitoNeg = (id) => (habitNegLog[id] && habitNegLog[id][selDia]) || 0;
      const accionarHabito = (id, tipo) => {
        if (!esHoy) return;
        const h = habitos.find(x => x.id === id);
        const v = valDe(h);
        if (tipo === 'positivo') {
          const ef = aplicar({ xp: v.xp, hp: v.cura, oro: Math.floor(v.xp / 2), dia: todayKey, xpDia: v.xp, tareas: 1 });
          pushEfecto('hp:' + id, ef);
          addFloater('+' + v.xp + ' XP', '#b6a6ff');
          setHabitLog(l => { const cur = { ...(l[id] || {}) }; cur[todayKey] = (cur[todayKey] || 0) + 1; return { ...l, [id]: cur }; });
        } else {
          const ef = aplicar({ hp: -v.dano, dia: todayKey });
          pushEfecto('hn:' + id, ef);
          if (ef.dTotal < 0) addFloater('¡Bajaste de nivel!', '#fb7185');
          else addFloater('−' + v.dano + ' HP', '#fb7185');
          setHabitNegLog(l => { const cur = { ...(l[id] || {}) }; cur[todayKey] = (cur[todayKey] || 0) + 1; return { ...l, [id]: cur }; });
        }
      };

      const bajarConteo = (mapa, id) => { const cur = { ...(mapa[id] || {}) }; const n = (cur[todayKey] || 0) - 1; if (n <= 0) delete cur[todayKey]; else cur[todayKey] = n; return { ...mapa, [id]: cur }; };
      // Fallback para acciones viejas (sin efecto guardado): recompensa positiva
      const efPos = (it) => { const v = valDe(it); return { dTotal: v.xp, dHp: v.cura, dOro: Math.floor(v.xp / 2), dia: todayKey, dXpDia: v.xp, dTareas: 1 }; };
      // Deshacer un "+" puesto por error: revierte el efecto EXACTO que dio
      const deshacerHabitoPos = (id) => {
        if (!esHoy || countHabito(id) <= 0) return;
        revertir(popEfecto('hp:' + id) || efPos(habitos.find(x => x.id === id)));
        setHabitLog(l => bajarConteo(l, id));
      };
      // Deshacer un "−" puesto por error: devuelve la vida EXACTA que quitó
      const deshacerHabitoNeg = (id) => {
        if (!esHoy || countHabitoNeg(id) <= 0) return;
        const ef = popEfecto('hn:' + id) || { dHp: -valDe(habitos.find(x => x.id === id)).dano };
        revertir(ef);
        addFloater(ef.dTotal < 0 ? 'Nivel recuperado' : '+' + Math.abs(ef.dHp || 0) + ' HP', '#34d399');
        setHabitNegLog(l => bajarConteo(l, id));
      };

      // Completar una tarea = registrar HOY en completedDates. NO borra la tarea: si es
      // recurrente, sólo se oculta el resto del día y reaparece en su próximo día programado.
      // Cada registro suma +1 acumulativo al progreso de la meta vinculada.
      const completarPendiente = (id) => {
        if (!esHoy) return;
        const p = pendientes.find(x => x.id === id);
        if (!p || hechaEn(p, todayKey)) return;
        const df = valDe(p);
        const ef = aplicar({ xp: df.xp, hp: df.cura, oro: Math.floor(df.xp / 2), dia: todayKey, xpDia: df.xp, tareas: 1 });
        pushEfecto('t:' + id, ef);
        addFloater('+' + df.xp + ' XP', '#b6a6ff');
        setPendientes(pendientes.map(x => x.id === id ? { ...x, completedDates: [...(x.completedDates || []), todayKey] } : x));
      };

      // Corrige una tarea marcada por error: quita HOY de completedDates y revierte el efecto EXACTO
      const deshacerPendiente = (id) => {
        if (!esHoy) return;
        const p = pendientes.find(x => x.id === id);
        if (!p || !hechaEn(p, todayKey)) return;
        revertir(popEfecto('t:' + id) || efPos(p));
        setPendientes(pendientes.map(x => x.id === id ? { ...x, completedDates: (x.completedDates || []).filter(d => d !== todayKey) } : x));
      };

      // ---- Alta de elementos (se registran en HOY) ----
      const agregarItem = (e) => {
        e.preventDefault();
        if (!esHoy) return;
        if (tab === 'notas') {
          if (!tituloNota.trim() || !contenidoNota.trim()) return;
          if (editandoNota) {
            setNotas(notas.map(n => n.id === editandoNota ? { ...n, titulo: tituloNota, contenido: contenidoNota } : n));
            setEditandoNota(null);
          } else {
            // Las notas NO dan XP: sólo se guardan
            setNotas([{ id: Date.now(), titulo: tituloNota, contenido: contenidoNota, fecha: todayKey }, ...notas]);
          }
          setTituloNota(''); setContenidoNota(''); return;
        }
        if (!nuevoTexto.trim()) return;
        const dias = (nuevaDias && nuevaDias.length ? nuevaDias : TODOS_DIAS);
        const base = { id: Date.now(), texto: nuevoTexto, dificultad: nuevaDif, creado: todayKey, dias };
        if (tab === 'habitos') setHabitos([...habitos, { ...base, tipo: nuevoTipo }]);
        if (tab === 'pendientes') setPendientes([...pendientes, { ...base, completedDates: [], fecha: todayKey, metaId: nuevaMetaId, recurrente: nuevaRecurrente, isArchived: false }]);
        setNuevoTexto('');
        setFormAbierto(false); // vuelve a comprimir el formulario tras guardar
      };

      const editarNota = (n) => { setEditandoNota(n.id); setTituloNota(n.titulo); setContenidoNota(n.contenido); setTab('notas'); };

      // ---- Programación por día de la semana + edición genérica (hábitos y tareas) ----
      const toggleNuevaDia = (n) => setNuevaDias(a => a.includes(n) ? a.filter(x => x !== n) : [...a, n]);
      // Editar cualquier hábito/tarea EN CUALQUIER MOMENTO (aunque esté programado para un día futuro)
      const abrirEditar = (it, kind) => setItemEdit({ kind, id: it.id, texto: it.texto, tipo: it.tipo || 'ambos', dificultad: it.dificultad || 'media', dias: diasDe(it).slice(), metaId: it.metaId ?? null, recurrente: it.recurrente !== false });
      const toggleDiaEdit = (n) => setItemEdit(e => ({ ...e, dias: e.dias.includes(n) ? e.dias.filter(x => x !== n) : [...e.dias, n] }));
      const guardarItemEdit = () => {
        if (!itemEdit) return;
        const dias = itemEdit.dias.length ? itemEdit.dias : TODOS_DIAS;
        const texto = (itemEdit.texto || '').trim();
        const campos = { dificultad: itemEdit.dificultad, dias };
        if (itemEdit.kind === 'habito') setHabitos(habitos.map(h => h.id === itemEdit.id ? { ...h, ...campos, tipo: itemEdit.tipo, texto: texto || h.texto } : h));
        else setPendientes(pendientes.map(p => p.id === itemEdit.id ? { ...p, ...campos, metaId: itemEdit.metaId ?? null, recurrente: itemEdit.recurrente !== false, texto: texto || p.texto } : p));
        setItemEdit(null);
      };

      // ---- Metas a largo plazo (progreso AUTOMÁTICO según tareas vinculadas) ----
      const COLORES_META = ['#a78bfa', '#34d399', '#38bdf8', '#f5b23e', '#fb7185', '#f472b6'];
      // Progreso de una meta = (tareas vinculadas completadas / total vinculadas) * 100.
      // Es derivado del estado de 'pendientes', así que al completar/deshacer/eliminar una
      // tarea la barra de la meta se recalcula sola en el siguiente render (sin recargar).
      // Cada tarea vinculada completada suma +1 al acumulado de la meta. El denominador
      // es el 'objetivo' total de la meta (si lo define); si no, el nº de tareas vinculadas.
      // Así la barra se llena progresivamente en vez de saltar al 100% con una sola tarea.
      const statsMeta = (m) => {
        const ligadas = pendientes.filter(p => p.metaId === m.id);
        // Acumulativo: cada fecha completada de cada tarea vinculada suma +1.
        const hechas = ligadas.reduce((s, p) => s + ((p.completedDates || []).length), 0);
        const vinculadas = ligadas.length;
        const objetivo = (m.objetivo && m.objetivo > 0) ? m.objetivo : vinculadas;
        const base = objetivo > 0 ? Math.min(100, Math.round((hechas / objetivo) * 100)) : 0;
        return { hechas, vinculadas, objetivo, manual: !!m.completadaManual, pct: m.completadaManual ? 100 : base };
      };
      // Marcar/desmarcar una meta como completada manualmente (sobrescribe el % al 100%).
      const completarMetaManual = (id, val) => setMetas(metas.map(m => m.id === id ? { ...m, completadaManual: val } : m));
      // Temporalidad de una meta (maneja fechas nulas de metas antiguas de forma segura).
      // Devuelve null si no hay ninguna fecha; si no, un rango legible y los días restantes.
      const infoTiempoMeta = (m) => {
        const inicio = (m && m.inicio) || null;
        const fin = (m && m.fin) || null;
        if (!inicio && !fin) return null;
        const rango = inicio && fin ? etiquetaCorta(inicio) + ' – ' + etiquetaCorta(fin)
          : fin ? 'Hasta ' + etiquetaCorta(fin) : 'Desde ' + etiquetaCorta(inicio);
        let restante = null, color = '#5b6270';
        if (fin) {

        else hechas.forEach(p => { const cd = p.completedDates || []; const ultima = cd[cd.length - 1]; line('- ' + p.texto + '  (' + cd.length + '×' + (ultima ? ', última ' + etiquetaCorta(ultima) : '') + ')'); });

        heading('Premios (' + recompensas.length + ')');
        if (!recompensas.length) line('- Sin premios.');
        else recompensas.forEach(r => line('- ' + r.texto + '  (' + r.costo + ' oro' + (r.veces ? ' · canjeado ' + r.veces + 'x' : '') + ')'));

        heading('Notas (' + notas.length + ')');
        if (!notas.length) line('- Sin notas.');
        else notas.forEach(n => {
          line(n.titulo + '   —   ' + etiquetaCorta(n.fecha), { bold: true, size: 11 });
          line(n.contenido, { color: [95, 95, 108], indent: 12, lh: 14 });
          y += 5;
        });

        doc.save('life-track-reporte-' + todayKey + '.pdf');
      };

      // ---- Navegación entre días ----
      const moverDia = (delta) => {
        const d = parseKey(selDia); d.setDate(d.getDate() + delta);
        const k = dk(d);
        if (k > todayKey) return; // sin futuro
        setSelDia(k);
      };

      // ---- Derivados de la vista ----
      const card = "bg-[#101019] border border-[rgba(129,120,241,0.16)] rounded-[10px]";
      const rejilla = "grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-[10px] items-start"; // varias columnas en PC
      const showInput = (esHoy && (['habitos', 'pendientes'].includes(tab) || (tab === 'notas' && notasVista === 'dia'))) || tab === 'premios' || tab === 'metas';
      const TIPOS = [
        { id: 'positivo', label: '+ Positivo', c: '#a78bfa' },
        { id: 'negativo', label: '− Negativo', c: '#fb7185' },
        { id: 'ambos', label: '± Ambos', c: '#8b93a3' },
      ];
      const notasDia = notas.filter(n => n.fecha === selDia);
      const notasMes = notas.filter(n => (n.fecha || '').slice(0, 7) === mesVista).sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
      const nombreMes = (() => { const s = parseKey(mesVista + '-01').toLocaleDateString('es-MX', { month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); })();
      const mesEsActual = mesVista >= todayKey.slice(0, 7);
      const cambiarMes = (delta) => {
        const [y, m] = mesVista.split('-').map(Number);
        const d = new Date(y, m - 1 + delta, 1);
        const nm = d.getFullYear() + '-' + pad(d.getMonth() + 1);
        if (nm > todayKey.slice(0, 7)) return; // sin meses futuros
        setMesVista(nm);
      };
      const notasLista = notasVista === 'mes' ? notasMes : notasDia;
      const vistaMes = tab === 'notas' && notasVista === 'mes'; // vista mensual: no depende del día seleccionado
      // Hábitos: "Hoy" = programados para el día visto; "Todas" = todos (para gestionar/editar futuros)
      const habitosTodas = habitos.filter(h => existe(h, selDia));
      const habitosDelDia = vistaLista === 'todas' ? habitosTodas : habitosTodas.filter(h => enDia(h, selDia));
      // "Hoy": sólo tareas que corresponden a este día (recurrente = coincide con el día de
      // la semana; de un solo uso = hasta completarla), no archivadas y no hechas ese día.
      const pendientesActivas = pendientes.filter(p => tareaActivaEn(p, selDia));
      // "Todas": todas las tareas vigentes (no archivadas, no hechas ese día), ignorando el
      // día de la semana, para poder gestionarlas/editarlas.
      const pendientesTodas = pendientes.filter(p => !p.isArchived && existe(p, selDia) && !hechaEn(p, selDia) && (p.recurrente === false ? (p.completedDates || []).length === 0 : true));
      const pendientesDelDia = vistaLista === 'todas' ? pendientesTodas : pendientesActivas;
      // Completadas EN el día seleccionado. INMUTABLE: se lee del historial (completedDates),
      // incluso si la tarea fue archivada (soft delete) después.
      const archivoTareasDia = pendientes.filter(p => hechaEn(p, selDia));
      // Historial LEGADO: diarias completadas ese día según diariaLog. Se busca el nombre en
      // 'diarias'; si la definición ya no existe, se muestra igualmente el registro.
      const archivoDiariasDia = Object.keys(diariaLog)
        .filter(did => diariaLog[did] && diariaLog[did][selDia])
        .map(did => { const d = diarias.find(x => String(x.id) === String(did)); return { id: 'diaria-' + did, texto: (d && d.texto) || 'Diaria', legado: true }; });
      // Registro unificado de logros del día (tareas + diarias legadas), para mostrarlo igual
      // que antes en los días anteriores.
      const archivoDia = [...archivoTareasDia, ...archivoDiariasDia];
      // Hábitos registrados ese día (positivos y recaídas), leídos de habitLog/habitNegLog.
      // Estos datos SIEMPRE se conservaron, así que sirven para ver el registro de días pasados.
      const archivoHabitosDia = (() => {
        const ids = new Set();
        Object.keys(habitLog).forEach(id => { if (habitLog[id] && habitLog[id][selDia]) ids.add(id); });
        Object.keys(habitNegLog).forEach(id => { if (habitNegLog[id] && habitNegLog[id][selDia]) ids.add(id); });
        return [...ids].map(id => {
          const h = habitos.find(x => String(x.id) === String(id));
          return { id: 'hab-' + id, texto: (h && h.texto) || 'Hábito', habito: true, pos: (habitLog[id] && habitLog[id][selDia]) || 0, neg: (habitNegLog[id] && habitNegLog[id][selDia]) || 0 };
        });
      })();
      // Registro COMPLETO del día para la pestaña Archivo (tareas + diarias + hábitos).
      const logrosDia = [...archivoDia, ...archivoHabitosDia];
      const xpDia = xpPorDia[selDia] || 0;
      const tareasDia = tareasPorDia[selDia] || 0;

      return (

                    <span className="mono text-[10px] font-bold text-[#8b93a3]">{xp}/100</span>
                  </div>
                  <SegBar pct={xp} c1="#8b5cf6" c2="#a855f7" />
                </div>
              </div>
            </div>

            <div className="mt-[15px] pt-[13px] border-t border-white/[0.06]">

                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f5b23e" strokeWidth="2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.5"></circle></svg>
                  <span className="mono text-[13px] font-extrabold text-[#e7e9ee]">{oro}</span>
                </div>
                <div className="flex items-center gap-[5px] px-[9px] py-[3px] rounded-full" style={{ background: rangoDe(nivel).c + '22', border: '1px solid ' + rangoDe(nivel).c + '55' }}>
                  <span className="w-[6px] h-[6px] rounded-full" style={{ background: rangoDe(nivel).c, boxShadow: '0 0 6px ' + rangoDe(nivel).c }}></span>
                  <span className="text-[10px] font-extrabold tracking-[0.02em]" style={{ color: rangoDe(nivel).c }}>{rangoDe(nivel).label}</span>
                </div>
                <div className="flex items-center gap-[5px] text-xs font-bold text-[#f59e42]"><span className="text-[13px]">🔥</span> {racha} días</div>
              </div>

                      boxShadow: d.isSel ? '0 0 10px rgba(124,115,240,0.4)' : 'none'
                    }}>{d.numero}</div>

                  </button>

          </header>

          <nav className="flex gap-1 px-2 py-2 bg-[#0b0b12] border-b border-white/[0.06] flex-shrink-0 overflow-x-auto hide-scrollbar">

                  <Icon />

          {/* ===== SELECTOR DE DÍA (oculto en la vista mensual de notas) ===== */}

          <div className="flex items-center justify-between px-3 py-[9px] bg-[#0a0a10] border-b border-white/[0.06] flex-shrink-0">

              <span className="text-[13px] font-bold" style={{ color: esHoy ? '#e7e9ee' : '#b6adf7' }}>{etiquetaFecha(selDia)}</span>
              {!esHoy && (
                <button onClick={() => setSelDia(todayKey)} className="text-[10px] font-bold px-[9px] py-[3px] rounded-full" style={{ background: 'rgba(124,115,240,0.16)', color: '#b6adf7' }}>Ir a hoy</button>
              )}
            </div>
            <button onClick={() => moverDia(1)} disabled={esHoy} className="w-8 h-8 rounded-lg flex items-center justify-center transition-all active:scale-90" style={{ color: esHoy ? '#33343d' : '#8b93a3', background: esHoy ? 'transparent' : 'rgba(255,255,255,0.04)' }}><IconChevron dir="right" /></button>
          </div>
          )}

          {/* ===== AVISO SOLO LECTURA ===== */}
          {!esHoy && tab !== 'premios' && !vistaMes && (
            <div className="flex items-center justify-center gap-[6px] py-[6px] bg-[#12101c] border-b border-white/[0.05] flex-shrink-0 text-[#8f86c9]">
              <IconLock /><span className="text-[10px] font-bold tracking-[0.02em]">Viendo {etiquetaCorta(selDia)} · sólo lectura</span>
            </div>

          {/* ===== AVISO PENALIZACIÓN POR DÍAS SIN ACTIVIDAD ===== */}
          {avisoPenal > 0 && (
            <div className="flex items-center justify-between px-4 py-[8px] flex-shrink-0" style={{ background: '#2a1620', borderBottom: '1px solid rgba(244,63,94,0.3)' }}>
              <span className="text-[11px] font-bold text-[#fb7185]">−{avisoPenal} de vida{avisoNiveles > 0 ? ' · bajaste ' + avisoNiveles + ' nivel' + (avisoNiveles === 1 ? '' : 'es') : ''} por {avisoDias} día{avisoDias === 1 ? '' : 's'} sin actividad</span>
              <button onClick={() => { setAvisoPenal(0); setAvisoNiveles(0); setAvisoDias(0); }} className="text-[#fb7185] text-xs font-bold flex-shrink-0 ml-2">✕</button>

          <main className={"flex-1 min-h-0 overflow-y-auto overscroll-contain hide-scrollbar p-4 " + (!showInput ? 'pb-6' : ((tab === 'habitos' || tab === 'pendientes') ? (formAbierto ? (tab === 'habitos' ? 'pb-56' : 'pb-64') : 'pb-24') : (tab === 'notas' ? 'pb-40' : (tab === 'metas' ? 'pb-60' : 'pb-32'))))} style={{ WebkitOverflowScrolling: 'touch' }}>

            {tab === 'dashboard' && (
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-[14px] items-start anim-fade">
                <h2 className="lg:col-span-2 text-[17px] font-extrabold text-[#f2f3f6] m-0 tracking-[-0.01em]">Resumen · {etiquetaFecha(selDia)}</h2>
                <div className="lg:col-span-2 grid grid-cols-2 gap-3">
                  <div className={card + " p-4 flex flex-col gap-[10px]"}>
                    <div className="flex items-center gap-[6px] text-[#8b93a3]"><span className="w-[7px] h-[7px] rounded-full bg-[#a855f7]"></span><span className="text-[9px] font-extrabold tracking-[0.05em] uppercase">XP del día</span></div>
                    <span className="mono text-[32px] font-extrabold leading-none text-[#c4b5fd]">{xpDia}</span>
                  </div>
                  <div className={card + " p-4 flex flex-col gap-[10px]"}>
                    <div className="flex items-center gap-[6px] text-[#8b93a3]"><span className="w-[7px] h-[7px] rounded-full bg-[#10b981]"></span><span className="text-[9px] font-extrabold tracking-[0.05em] uppercase">Acciones</span></div>
                    <span className="mono text-[32px] font-extrabold leading-none text-[#6ee7b7]">{tareasDia}</span>
                  </div>
                </div>
                <div className={card + " lg:col-span-2 p-[18px]"}>
                  <div className="flex justify-between items-center mb-[18px]">
                    <h3 className="text-[13px] font-bold text-[#d3d6dd] m-0">Productividad semanal</h3>
                    <span className="text-[10px] text-[#5b6270] font-semibold">7 días</span>
                  </div>
                  <div className="flex items-end justify-between gap-[7px] h-[126px]">
                    {semana.map(d => (
                      <button key={d.id} onClick={() => setSelDia(d.id)} className="flex flex-col items-center justify-end flex-1 h-full gap-2 focus:outline-none">
                        <div className="w-full flex-1 flex items-end">
                          <div className="w-full transition-all duration-700" style={{
                            height: d.actividad + '%', minHeight: 4, borderRadius: '3px 3px 0 0',
                            background: d.actividad > 5 ? 'linear-gradient(180deg,#a855f7,#7c73f0)' : 'rgba(255,255,255,0.07)',
                            boxShadow: d.actividad > 5 ? '0 0 12px rgba(124,115,240,0.3)' : 'none',
                            outline: d.isSel ? '1.5px solid ' + ACCENT : 'none'
                          }}></div>
                        </div>
                        <span className="text-[9px] font-bold uppercase" style={{ color: d.isSel ? '#b6adf7' : '#5b6270' }}>{d.nombre}</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {tab === 'habitos' && (
              <div className={rejilla + " anim-fade"}>

                    const sel = vistaLista === v.id;

                      <button key={v.id} onClick={() => setVistaLista(v.id)} className="flex-1 py-[8px] rounded-lg text-[12px] font-bold transition-all" style={{

                        border: sel ? '1px solid rgba(124,115,240,0.5)' : '1px solid rgba(255,255,255,0.06)'
                      }}>{v.label}</button>

                </div>
                {habitosDelDia.length === 0 && <div className="col-span-full text-center py-11 text-[#5b6270] text-sm italic">{habitos.length === 0 ? 'Añade tu primer hábito abajo.' : (vistaLista === 'todas' ? 'Aún no tienes hábitos.' : 'Ningún hábito programado para este día.')}</div>}
                {habitosDelDia.map(h => {
                  const veces = countHabito(h.id);
                  const vecesNeg = countHabitoNeg(h.id);
                  const hechoPos = veces > 0;
                  const hechoNeg = vecesNeg > 0;
                  const marcado = hechoPos || hechoNeg;
                  const bg = hechoNeg ? '#241320' : (hechoPos ? '#161433' : '#101019');

                  <div className="border-t border-white/[0.06] pt-[14px]">
                    <div className="flex items-center gap-[6px] text-[#8b93a3] mb-[6px]"><span className="w-[7px] h-[7px] rounded-full bg-[#f5b23e]"></span><span className="text-[9px] font-extrabold tracking-[0.05em] uppercase">Copia de seguridad (archivo)</span></div>
                    <p className="text-[11px] text-[#6b7280] leading-relaxed m-0 mb-[10px]">Guarda un archivo con <b className="text-[#8b93a3]">todos</b> tus datos y restáuralo cuando quieras (si cambias de teléfono o limpias el navegador).</p>
                    <div className="flex gap-2">
                      <button onClick={exportarDatos} className="flex-1 py-[10px] rounded-lg text-[12px] font-bold text-[#c4b5fd] active:scale-95 transition-all" style={{ background: 'rgba(124,115,240,0.16)', border: '1px solid rgba(124,115,240,0.4)' }}>Exportar copia</button>
                      <button onClick={() => importRef.current && importRef.current.click()} className="flex-1 py-[10px] rounded-lg text-[12px] font-bold text-[#9aa1ad] active:scale-95 transition-all" style={{ background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)' }}>Restaurar (reemplaza)</button>
                      <input type="file" accept="application/json,.json" ref={importRef} onChange={importarDatos} className="hidden" />
                    </div>
                    <div className="mt-[10px] p-[10px] rounded-lg" style={{ background: 'rgba(52,211,153,0.08)', border: '1px solid rgba(52,211,153,0.3)' }}>
                      <p className="text-[11px] text-[#8b93a3] leading-relaxed m-0 mb-[8px]">¿Perdiste historial? Sube un respaldo <b className="text-[#6ee7b7]">anterior</b> y se <b className="text-[#6ee7b7]">fusiona</b> con tus datos actuales: recupera lo viejo <b className="text-[#8b93a3]">sin borrar</b> los días recientes.</p>
                      <button onClick={() => mergeRef.current && mergeRef.current.click()} className="w-full py-[10px] rounded-lg text-[12px] font-bold text-[#231600] active:scale-95 transition-all" style={{ background: 'linear-gradient(135deg,#34d399,#10b981)', boxShadow: '0 4px 12px rgba(16,185,129,0.3)' }}>Fusionar respaldo (recuperar historial)</button>
                      <input type="file" accept="application/json,.json" ref={mergeRef} onChange={fusionarDatos} className="hidden" />
                    </div>
                  </div>
                  <div className="border-t border-white/[0.06] pt-[14px]">
                    <div className="flex items-center gap-[6px] text-[#8b93a3] mb-[6px]"><span className="w-[7px] h-[7px] rounded-full bg-[#fb7185]"></span><span className="text-[9px] font-extrabold tracking-[0.05em] uppercase">Reporte PDF</span></div>
                    <p className="text-[11px] text-[#6b7280] leading-relaxed m-0 mb-[10px]">Un resumen legible de tu progreso, hábitos, tareas y notas — para leer, imprimir o compartir.</p>
                    <button onClick={descargarPDF} className="w-full py-[10px] rounded-lg text-[12px] font-bold text-white active:scale-95 transition-all" style={{ background: 'linear-gradient(135deg,#7c73f0,#a855f7)', boxShadow: '0 4px 14px rgba(124,115,240,0.35)' }}>Descargar PDF</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ===== MODAL CONFIG FIREBASE ===== */}
          {configAbierto && (
            <div className="absolute inset-0 z-[70] flex items-end" style={{ background: 'rgba(6,6,10,0.82)', backdropFilter: 'blur(6px)' }} onClick={() => setConfigAbierto(false)}>
              <div onClick={e => e.stopPropagation()} className="w-full p-6 border-t border-white/10 flex flex-col gap-3" style={{ background: '#12121a', borderRadius: '28px 28px 0 0', maxHeight: '90%', animation: 'slideUp .3s ease', overflowY: 'auto' }}>
                <div className="flex justify-between items-center gap-3">
                  <h2 className="text-lg font-extrabold text-[#f2f3f6] m-0">Configurar Firebase</h2>
                  <button onClick={() => setConfigAbierto(false)} className="w-[34px] h-[34px] rounded-full bg-white/[0.07] text-[#8b93a3] text-sm flex-shrink-0">✕</button>
                </div>
                <div className="text-[11px] text-[#8b93a3] leading-relaxed flex flex-col gap-[6px]">
                  <span className="font-bold text-[#c4b5fd]">Pasos (una sola vez):</span>
                  <span>1. Entra a <b className="text-[#d3d6dd]">console.firebase.google.com</b> y crea un proyecto (gratis).</span>
                  <span>2. En el proyecto: <b className="text-[#d3d6dd]">Build → Firestore Database → Crear</b> (modo producción).</span>
                  <span>3. <b className="text-[#d3d6dd]">Build → Authentication → Sign-in method → Email/Password</b> → activar.</span>
                  <span>4. En <b className="text-[#d3d6dd]">Configuración del proyecto ⚙ → Tus apps → Web (&lt;/&gt;)</b>, registra una app y copia el bloque <b className="text-[#d3d6dd]">firebaseConfig</b>.</span>
                  <span>5. Pégalo aquí abajo:</span>
                </div>
                <textarea value={configTexto} onChange={e => setConfigTexto(e.target.value)} placeholder={'const firebaseConfig = {\n  apiKey: "…",\n  authDomain: "…",\n  projectId: "…",\n  ...\n};'} className="w-full h-32 bg-[#0c0c14] border border-white/10 rounded-lg p-3 text-[11px] text-[#c2c6cf] mono outline-none resize-none focus:border-[#38bdf8]" />
                {syncError && <span className="text-[11px] font-bold text-[#fb7185]">{syncError}</span>}
                <button onClick={guardarConfigFB} disabled={!configTexto.trim()} className="w-full py-[11px] rounded-lg text-white text-[13px] font-bold" style={{ background: configTexto.trim() ? 'linear-gradient(135deg,#38bdf8,#3b82f6)' : 'rgba(255,255,255,0.06)', opacity: configTexto.trim() ? 1 : 0.5 }}>Guardar y conectar</button>
                <p className="text-[10px] text-[#5b6270] leading-relaxed m-0">Nota: esta configuración es pública (no es secreta). Tu privacidad la protegen las reglas de Firestore, que restringen cada cuenta a sus propios datos.</p>
              </div>
            </div>
          )}

          {/* ===== MODAL TRASPASO DE DATOS ===== */}
          {transfer && (
            <div className="absolute inset-0 z-[70] flex items-end" style={{ background: 'rgba(6,6,10,0.82)', backdropFilter: 'blur(6px)' }} onClick={() => setTransfer(null)}>
              <div onClick={e => e.stopPropagation()} className="w-full p-6 border-t border-white/10 flex flex-col gap-3" style={{ background: '#12121a', borderRadius: '28px 28px 0 0', maxHeight: '86%', animation: 'slideUp .3s ease' }}>
                <div className="flex justify-between items-center gap-3">
                  <h2 className="text-lg font-extrabold text-[#f2f3f6] m-0">{transfer === 'copiar' ? 'Copiar mis datos' : 'Pegar datos'}</h2>
                  <button onClick={() => setTransfer(null)} className="w-[34px] h-[34px] rounded-full bg-white/[0.07] text-[#8b93a3] text-sm flex-shrink-0">✕</button>
                </div>
                {transfer === 'copiar' ? (
                  <>
                    <p className="text-[12px] text-[#8b93a3] leading-relaxed m-0">Toca <b className="text-[#c4b5fd]">Copiar al portapapeles</b> y envíate este texto a ti mismo (WhatsApp, Notas, correo). En tu otro dispositivo, abre la app → Panel → <b className="text-[#c4b5fd]">Pegar datos</b>.</p>
                    <textarea readOnly value={textoTransfer} onFocus={e => e.target.select()} className="w-full h-40 bg-[#0c0c14] border border-white/10 rounded-lg p-3 text-[10px] text-[#8b93a3] mono outline-none resize-none" />
                    <button onClick={copiarPortapapeles} className="w-full py-[11px] rounded-lg text-[#231600] text-[13px] font-bold" style={{ background: 'linear-gradient(135deg,#34d399,#10b981)' }}>Copiar al portapapeles</button>
                  </>
                ) : (
                  <>
                    <p className="text-[12px] text-[#8b93a3] leading-relaxed m-0">Pega aquí el texto que copiaste en tu otro dispositivo y toca <b className="text-[#c4b5fd]">Cargar datos</b>. Esto reemplazará los datos de <b className="text-[#fb7185]">este</b> dispositivo.</p>
                    <textarea value={textoPegar} onChange={e => setTextoPegar(e.target.value)} placeholder="Pega aquí tus datos..." className="w-full h-40 bg-[#0c0c14] border border-white/10 rounded-lg p-3 text-[10px] text-[#c2c6cf] mono outline-none resize-none focus:border-[#7c73f0]" />
                    <button onClick={cargarDesdeTexto} disabled={!textoPegar.trim()} className="w-full py-[11px] rounded-lg text-white text-[13px] font-bold transition-all" style={{ background: textoPegar.trim() ? 'linear-gradient(135deg,#7c73f0,#a855f7)' : 'rgba(255,255,255,0.06)', opacity: textoPegar.trim() ? 1 : 0.5 }}>Cargar datos</button>
                  </>
                )}
              </div>
            </div>
          )}

          {/* ===== MODAL NOTA ===== */}
          {notaExpandida && (
            <div className="absolute inset-0 z-[70] flex items-end" style={{ background: 'rgba(6,6,10,0.82)', backdropFilter: 'blur(6px)' }} onClick={() => setNotaExpandida(null)}>
              <div onClick={e => e.stopPropagation()} className="w-full p-6 border-t border-white/10 flex flex-col" style={{ background: '#12121a', borderRadius: '28px 28px 0 0', maxHeight: '78%', animation: 'slideUp .3s ease' }}>
                <div className="flex justify-between items-start mb-4 gap-3">
                  <div className="min-w-0">
                    <h2 className="text-lg font-extrabold text-[#f2f3f6] m-0 mb-1">{notaExpandida.titulo}</h2>
                    <span className="text-[11px] text-[#5b6270] font-semibold">{etiquetaCorta(notaExpandida.fecha)}</span>
                  </div>
                  <button onClick={() => setNotaExpandida(null)} className="w-[34px] h-[34px] rounded-full bg-white/[0.07] text-[#8b93a3] text-sm flex-shrink-0">✕</button>
                </div>
                <div className="overflow-y-auto text-[#c2c6cf] text-sm leading-relaxed whitespace-pre-wrap">{notaExpandida.contenido}</div>
              </div>
            </div>
          )}

          {/* ===== MODAL AJUSTES DE BALANCE ===== */}
          {ajustesAbierto && (
            <div className="absolute inset-0 z-[70] flex items-end" style={{ background: 'rgba(6,6,10,0.82)', backdropFilter: 'blur(6px)' }} onClick={() => setAjustesAbierto(false)}>
              <div onClick={e => e.stopPropagation()} className="w-full p-6 border-t border-white/10 flex flex-col" style={{ background: '#12121a', borderRadius: '28px 28px 0 0', maxHeight: '86%', animation: 'slideUp .3s ease' }}>
                <div className="flex justify-between items-center mb-4 gap-3">
                  <h2 className="text-lg font-extrabold text-[#f2f3f6] m-0">Ajustes de balance</h2>
                  <button onClick={() => setAjustesAbierto(false)} className="w-[34px] h-[34px] rounded-full bg-white/[0.07] text-[#8b93a3] text-sm flex-shrink-0">✕</button>
                </div>

                <div className="overflow-y-auto hide-scrollbar flex flex-col gap-4">
                  <div>
                    <span className="text-[10px] font-extrabold tracking-[0.05em] uppercase text-[#8b93a3]">Modo</span>
                    <div className="grid grid-cols-2 gap-2 mt-2">
                      {MODOS.map(m => {
                        const sel = modoBalance === m.id;
                        return (
                          <button key={m.id} onClick={() => aplicarModo(m.id)} className="text-left p-[10px] rounded-lg transition-all" style={{
                            background: sel ? 'rgba(124,115,240,0.16)' : 'rgba(255,255,255,0.04)',
                            border: sel ? '1px solid rgba(124,115,240,0.5)' : '1px solid rgba(255,255,255,0.07)'
                          }}>
                            <div className="text-[13px] font-bold" style={{ color: sel ? '#c4b5fd' : '#cdd0d8' }}>{m.label}</div>
                            <div className="text-[10px] text-[#6b7280] leading-tight mt-[2px]">{m.desc}</div>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] font-extrabold tracking-[0.05em] uppercase text-[#8b93a3]">XP que da / vida que quita</span>
                      <span className="text-[9px] text-[#5b6270]">{modoBalance === 'personalizado' ? 'toca para editar' : 'según el modo'}</span>
                    </div>
                    <div className="flex flex-col gap-2">
                      <div className="grid grid-cols-[1fr_auto_auto] gap-2 items-center px-1">
                        <span className="text-[9px] font-bold text-[#5b6270] uppercase">Dificultad</span>
                        <span className="text-[9px] font-bold text-[#a78bfa] uppercase w-[54px] text-center">+XP</span>
                        <span className="text-[9px] font-bold text-[#fb7185] uppercase w-[54px] text-center">−Vida</span>
                      </div>
                      {DIF_ORDEN.map(k => {
                        const v = balance[k] || PRESETS.normal[k];
                        return (
                          <div key={k} className="grid grid-cols-[1fr_auto_auto] gap-2 items-center bg-[#0d0d14] border border-white/[0.06] rounded-lg p-2">
                            <span className="text-[12px] font-bold flex items-center gap-[6px]" style={{ color: DIF[k].c }}>● {DIF[k].label}</span>
                            <input type="number" min="0" max="999" value={v.xp} onChange={e => setBalVal(k, 'xp', e.target.value)} className="mono w-[54px] bg-[#0c0c14] border border-white/10 rounded-md px-2 py-[6px] text-[13px] text-[#c4b5fd] text-center outline-none focus:border-[#7c73f0]" />
                            <input type="number" min="0" max="999" value={v.dano} onChange={e => setBalVal(k, 'dano', e.target.value)} className="mono w-[54px] bg-[#0c0c14] border border-white/10 rounded-md px-2 py-[6px] text-[13px] text-[#fb7185] text-center outline-none focus:border-[#7c73f0]" />
                          </div>
                        );
                      })}
                    </div>
                    <p className="text-[10px] text-[#6b7280] leading-relaxed mt-2 m-0">Editar cualquier número te pone en modo <b className="text-[#8b93a3]">Personalizado</b>. Aplica a lo que hagas de ahora en adelante.</p>
                  </div>

                  <div className="border-t border-white/[0.06] pt-3">
                    <span className="text-[10px] font-extrabold tracking-[0.05em] uppercase text-[#8b93a3]">Rangos por nivel</span>
                    <div className="flex flex-wrap gap-[6px] mt-2">
                      {RANGOS.map(r => {
                        const actual = rangoDe(nivel).label === r.label;
                        return (
                          <span key={r.label} className="text-[10px] font-bold px-[9px] py-[4px] rounded-full" style={{ background: r.c + (actual ? '33' : '14'), color: r.c, border: '1px solid ' + r.c + (actual ? '99' : '33') }}>{r.label} · Lv{r.min}</span>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    (function () {
      function boot() {
        var src = document.getElementById('app-src').textContent;
        var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
        (0, eval)(out);
      }
      if (window.Babel) boot();
      else window.addEventListener('DOMContentLoaded', boot);
    })();
  </script>

  <script>
    // Service worker: instalación, uso sin internet y auto-actualización.
    if ('serviceWorker' in navigator) {
      // Cuando una versión nueva toma el control, recarga UNA sola vez por sesión de pestaña
      // (con sessionStorage), para que jamás pueda formar un bucle de recargas.
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        try { if (sessionStorage.getItem('sw_recargado')) return; sessionStorage.setItem('sw_recargado', '1'); } catch (e) {}
        window.location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          reg.update();
          setInterval(function () { reg.update(); }, 60 * 60 * 1000);
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
